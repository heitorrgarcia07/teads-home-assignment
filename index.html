<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Creative Review</title>
</head>
<body>
  <h1>Ad Creative Review</h1>
  <button id="reviewAds">Review Ads</button>
  <p id="message" role="status"></p>

  <script>
    const reviewAdsButton = document.getElementById("reviewAds");
    const message = document.getElementById("message");

    reviewAdsButton.addEventListener("click", async () => {
      reviewAdsButton.disabled = true;

      try {
        message.textContent = "Reviewing ads...";

        const response = await fetch(
          "https://jsonplaceholder.typicode.com/posts"
        );

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const creatives = await response.json();
        const reviewedCreatives = creatives.map((creative) => {
          let status;

          if (creative.id % 3 === 0) {
            status = "rejected";
          } else if (creative.id % 2 === 0) {
            status = "approved";
          } else {
            status = "pending";
          }

          return {
            id: creative.id,
            title: status === "rejected"
              ? creative.title.toUpperCase()
              : creative.title,
            status: status
          };
        });

        console.log(reviewedCreatives);
        message.textContent =
          "Ads reviewed successfully. Check the browser console.";
      } catch (error) {
        console.error("Unable to review ads:", error);
        message.textContent =
          "Unable to review ads. Please try again later.";
      } finally {
        reviewAdsButton.disabled = false;
      }
    });
  </script>
</body>
</html>
